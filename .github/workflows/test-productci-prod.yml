name: Product API CI Production Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-product-api:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 3000
      MONGODB_URI: mongodb://localhost:27017/productdb

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Start Product API
        run: |
          node server.js > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for Product API
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:3000/health; then
              exit 0
            fi
            sleep 2
          done

          cat server.log
          exit 1

      - name: Test CREATE Product
        run: |
          curl -f -X POST http://localhost:3000/products \
            -H "Content-Type: application/json" \
            -d '{"pid":"P001","pname":"Laptop","price":15000000,"quantity":10}'

      - name: Test READ All Products
        run: |
          curl -f http://localhost:3000/products

      - name: Test READ Product by PID
        run: |
          curl -f http://localhost:3000/products/P001

      - name: Test UPDATE Product
        run: |
          curl -f -X PUT http://localhost:3000/products/P001 \
            -H "Content-Type: application/json" \
            -d '{"pname":"Laptop Gaming","price":20000000,"quantity":5}'

      - name: Test DELETE Product
        run: |
          curl -f -X DELETE http://localhost:3000/products/P001