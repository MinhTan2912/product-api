name: Product API CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 3000
      MONGODB_URI: mongodb://localhost:27017/productdb

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Start Product API
        run: |
          node server.js > server.log 2>&1 &
          echo $! > server.pid

      - name: Healthcheck Product API
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:3000/health; then
              echo "Product API is healthy"
              exit 0
            fi
            sleep 2
          done

          cat server.log
          exit 1

      - name: Test CREATE Product
        run: |
          curl -f -X POST http://localhost:3000/products \
            -H "Content-Type: application/json" \
            -d '{"pid":"P001","pname":"Laptop","price":15000000,"quantity":10}'

      - name: Test READ Product
        run: curl -f http://localhost:3000/products/P001

      - name: Test UPDATE Product
        run: |
          curl -f -X PUT http://localhost:3000/products/P001 \
            -H "Content-Type: application/json" \
            -d '{"pname":"Laptop Gaming","price":20000000,"quantity":5}'

      - name: Test DELETE Product
        run: curl -f -X DELETE http://localhost:3000/products/P001

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            minhtan2912/product-api:latest
            minhtan2912/product-api:${{ github.sha }}